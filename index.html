<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LissaLoop — audio oscilloscope live coding</title>
  <style>body { margin: 0; overflow: hidden; background: #000; }</style>
  <!-- bundled locally so it works offline -->
  <script src="lib/p5.min.js"></script>
  <script>
    // The microphone and p5.sound need a secure page (http://localhost or https).
    // Opened as a file or from a network IP, p5.sound blocks p5 forever (black
    // screen), so it is skipped: the visuals run without sound and say why.
    var _NO_SOUND = !window.isSecureContext || typeof AudioWorkletNode === 'undefined';
    if (!_NO_SOUND) document.write('<script src="lib/p5.sound.min.js"><\/script>');
  </script>
  <script src="audio.js"></script>
  <script src="lissaloop.js"></script>
  <script src="presets.js"></script>
  <script src="editor.js"></script>
</head>
<body></body>
</html>
